<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONチェッカー｜11月1日 9:00 公開</title>
<!-- 準備中ページ。11/1 9:00 に本物の index.html で上書きしてください -->
<style>
  :root{
    --violet:#a870f8; --violet-dp:#7b3fd4; --cyan:#5fd8ff; --pink:#ff6cbc;
    --yellow:#ffe800; --ink:#000; --pale:#f2ecfb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    background:var(--pale);
    background-image:repeating-linear-gradient(135deg,
      rgba(168,112,248,.07) 0px, rgba(168,112,248,.07) 14px,
      transparent 14px, transparent 40px);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    color:#23133f;
    display:flex; align-items:center; justify-content:center;
    padding:24px 14px;
  }
  #card{
    background:#fff; border:5px solid var(--ink); border-radius:26px;
    box-shadow:8px 8px 0 var(--ink);
    padding:34px 26px 30px; text-align:center;
    width:min(94vw,560px);
  }
  h1{
    font-size:clamp(26px,6.4vw,42px); font-weight:900;
    letter-spacing:.06em; line-height:1.2;
    color:var(--violet-dp);
  }
  .sub{
    margin-top:10px; font-size:clamp(12px,2.6vw,15px);
    font-weight:800; letter-spacing:.12em; color:var(--violet);
  }
  .open-at{
    margin-top:26px; display:inline-block;
    background:var(--yellow); border:4px solid var(--ink); border-radius:999px;
    box-shadow:0 5px 0 var(--ink);
    padding:11px 22px 10px;
    font-size:clamp(13px,3.3vw,18px); font-weight:900; letter-spacing:.04em;
    white-space:nowrap;
  }
  .open-at .y{ font-size:.78em; opacity:.75; margin-right:.3em; }
  #count{
    margin-top:24px; font-size:clamp(24px,6vw,38px); font-weight:900;
    letter-spacing:.04em; font-variant-numeric:tabular-nums; color:var(--ink);
  }
  #count-label{
    font-size:clamp(11px,2.2vw,13px); font-weight:800;
    letter-spacing:.2em; color:var(--violet); display:block; margin-bottom:4px;
  }
  .note{
    margin-top:26px; font-size:clamp(11px,2.3vw,13px);
    line-height:1.8; color:#8d7ba8;
  }
  .dots{margin-top:20px}
  .dots span{
    display:inline-block; width:12px; height:12px; margin:0 4px;
    border-radius:50%; border:2.5px solid var(--ink); background:#ebe3f7;
  }
  .dots span:nth-child(1){background:var(--cyan)}
  .dots span:nth-child(2){background:var(--violet)}
  .dots span:nth-child(3){background:var(--pink)}
</style>
</head>
<body>
  <div id="card">
    <h1>PONチェッカー</h1>
    <div class="sub">TIMING STOP GAME</div>

    <div class="dots"><span></span><span></span><span></span></div>

    <div class="open-at"><span class="y">2026</span>11月1日(日) 9:00 公開</div>

    <div id="count">
      <span id="count-label">OPEN まで</span>
      <span id="count-value">--</span>
    </div>

    <p class="note">
      秋のPON！まつり 開催にあわせて公開します。<br>
      このページはそのまま置いておいてください。
    </p>
  </div>

<script>
  "use strict";
  // 公開予定時刻（日本時間 2026/11/1 9:00）
  const OPEN_AT = new Date("2026-11-01T09:00:00+09:00").getTime();
  const el = document.getElementById("count-value");
  const label = document.getElementById("count-label");
  const pad = (n) => String(n).padStart(2, "0");

  function tick() {
    const diff = OPEN_AT - Date.now();
    if (diff <= 0) {
      label.textContent = "";
      el.textContent = "まもなく公開！";
      return;
    }
    const s = Math.floor(diff / 1000) % 60;
    const m = Math.floor(diff / 60000) % 60;
    const h = Math.floor(diff / 3600000) % 24;
    const d = Math.floor(diff / 86400000);
    el.textContent = (d > 0 ? d + "日 " : "") + pad(h) + ":" + pad(m) + ":" + pad(s);
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
