<style>
  /* ============================================================
     PONチェッカー
     配色：ビビッド紫 × シアン × ピンク × 黄 ＋ 黒フチ
     （イラストのパレットに合わせたポップ／ステッカー路線）
     ============================================================ */
  :root {
    --violet:     #a870f8;
    --violet-dp:  #7b3fd4;
    --cyan:       #5fd8ff;
    --cyan-dp:    #00a8de;
    --pink:       #ff6cbc;
    --pink-dp:    #d94a96;
    --yellow:     #ffe800;
    --ink:        #000000;   /* 黒フチ */
    --paper:      #ffffff;   /* カードの白 */
    --pale:       #f2ecfb;   /* 背景の淡いラベンダー */

    /* ゲージの配色（ここだけ変えれば難易度表示の色を調整できます） */
    --zone-ok:    #3ddc97;   /* 成功ゾーン＝鮮やかなミント */
    --zone-ng:    #d8cef0;   /* 失敗ゾーン＝淡いラベンダー（沈む） */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }

  body {
    background: var(--pale);
    background-image:
      repeating-linear-gradient(135deg,
        rgba(168,112,248,0.07) 0px,
        rgba(168,112,248,0.07) 14px,
        transparent 14px,
        transparent 40px);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    color: #23133f;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 14px 40px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #app { width: min(96vw, 680px); }

  /* 白いカード（ステッカー風に黒フチ＋ハードシャドウ） */
  #panel {
    background: var(--paper);
    border: 5px solid var(--ink);
    border-radius: 26px;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 16px 16px 22px;
    text-align: center;
  }

  /* ============================================================
     タイトルバナー
     ============================================================ */
  /* ▼ バナー画像を差し替える場合は、下のimgのsrcを変えるだけ ▼ */
  #banner {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 14px;
  }

  /* ============================================================
     ステージ選択画面
     ============================================================ */
  #select-screen { display: block; }

  .lead {
    font-size: clamp(13px, 2.6vw, 16px);
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--violet-dp);
    margin-bottom: 18px;
  }

  /* ---------- ステッカー風ボタン ---------- */
  .sticker-btn {
    display: block;
    width: min(88%, 360px);
    margin: 14px auto;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(17px, 3.4vw, 22px);
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    color: var(--ink);
    padding: 15px 0 12px;
    border: 4px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.07s ease, box-shadow 0.07s ease;
  }
  .sticker-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
  .sticker-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--ink); }
  .sticker-btn:focus-visible { outline: 4px solid var(--violet); outline-offset: 3px; }

  .sticker-btn .stage-desc {
    display: block;
    font-size: 0.54em;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-indent: 0;
    margin-top: 5px;
    opacity: 0.72;
  }

  #btn-easy   { background: var(--cyan); }
  #btn-normal { background: var(--violet); }
  #btn-hard   { background: var(--pink); }

  /* ---------- ごほうびコード ---------- */
  #reward-area { margin-top: 22px; }

  #reward-toggle {
    font-family: inherit;
    font-size: clamp(12px, 2.3vw, 14px);
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--violet-dp);
    background: #fff;
    border: 3px solid var(--violet);
    border-radius: 999px;
    padding: 9px 22px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #reward-toggle:hover { background: var(--violet); color: #fff; }
  #reward-toggle:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

  #reward-form { display: none; margin-top: 14px; }

  #reward-form.open { display: block; }

  .reward-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #reward-input {
    font-family: inherit;
    font-size: 16px; /* 16px未満だとiOSで自動ズームするため固定 */
    font-weight: 800;
    letter-spacing: 0.1em;
    text-align: center;
    width: min(64%, 240px);
    padding: 11px 14px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: #fdfaff;
  }
  #reward-input:focus { outline: 3px solid var(--violet); outline-offset: 1px; }

  #reward-submit {
    font-family: inherit;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 11px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--ink);
  }
  #reward-submit:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
  #reward-submit:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

  #reward-msg {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--pink-dp);
    min-height: 18px;
  }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .reward-hint {
    margin-top: 10px;
    font-size: 11.5px;
    line-height: 1.6;
    color: #8d7ba8;
  }

  /* ============================================================
     ゲーム画面
     ============================================================ */
  #game-screen { display: none; cursor: pointer; }

  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }

  #stage-label {
    font-size: clamp(13px, 2.6vw, 16px);
    font-weight: 900;
    letter-spacing: 0.14em;
    color: var(--ink);
    padding: 6px 16px 5px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--ink);
  }
  #stage-label.easy   { background: var(--cyan); }
  #stage-label.normal { background: var(--violet); }
  #stage-label.hard   { background: var(--pink); }

  #streak-label {
    font-size: clamp(12px, 2.4vw, 15px);
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--violet-dp);
  }
  #streak-count {
    font-size: 1.5em;
    font-weight: 900;
    color: var(--pink-dp);
  }

  /* HUD右側：連続数と進行中タイムを縦に積む */
  #hud-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  #live-timer {
    font-size: clamp(12px, 2.4vw, 15px);
    font-weight: 900;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 2px 12px 3px;
    font-variant-numeric: tabular-nums;
  }
  #live-timer.off { display: none; }

  /* ---------- 連続成功カウンター（肉球スタンプ） ---------- */
  #pips {
    display: flex;
    justify-content: center;
    gap: clamp(3px, 1.2vw, 7px);
    margin-bottom: 16px;
  }
  .pip {
    width: clamp(21px, 6.2vw, 30px);
    height: clamp(21px, 6.2vw, 30px);
    border: 2.5px solid var(--ink);
    border-radius: 50%;
    background: #ebe3f7;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  .pip img {
    width: 66%;
    height: 66%;
    object-fit: contain;
    /* 未取得：黒いシルエットを薄く表示 */
    opacity: 0.22;
    filter: brightness(0);
    transition: opacity 0.18s ease, filter 0.18s ease;
  }
  .pip.on {
    background: var(--pink);
    transform: scale(1.1);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
  }
  /* 取得済み：ピンクの丸に白い肉球 */
  .pip.on img { opacity: 1; filter: brightness(0) invert(1); }

  /* ---------- ゲージ ---------- */
  #gauge-frame {
    position: relative;
    height: 54px;
  }

  #gauge {
    position: relative;
    height: 100%;
    border: 5px solid var(--ink);
    border-radius: 15px;
    overflow: hidden;
    background: var(--zone-ng);
    box-shadow: 0 5px 0 var(--ink);
  }

  /* マーカーの可動域：ゲージの内側の帯とぴったり重なる */
  #marker-track {
    position: absolute;
    left: 5px;
    right: 5px;
    top: 0;
    bottom: 0;
    pointer-events: none;
  }

  #ok-zone {
    position: absolute;
    top: 0;
    height: 100%;
    background: var(--zone-ok);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.18);
  }

  /* 上面のツヤ */
  #gauge::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 42%;
    background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0));
    pointer-events: none;
    z-index: 2;
  }

  /* マーカー：ゲージの上下にはみ出す針。黒＋白フチで背景色を選ばない */
  #marker {
    position: absolute;
    top: -9px;
    bottom: -9px;
    width: 12px;
    margin-left: -6px;
    background: var(--ink);
    border: 3px solid #fff;
    border-radius: 6px;
    box-shadow: 0 0 0 2px var(--ink);
    z-index: 3;
    will-change: left;
  }

  #hint {
    margin-top: 14px;
    font-size: clamp(11px, 2.1vw, 13.5px);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #8d7ba8;
  }

  /* ============================================================
     結果表示
     ============================================================ */
  #result-area {
    min-height: 272px;
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .result-box { display: none; }   /* JSで表示切替 */

  .result-box.show {
    display: block;
    animation: pop-in 0.34s cubic-bezier(0.2, 1.7, 0.4, 1);
  }

  /* 成功／PON！：四角いイラストをシール風の枠で見せる */
  .stamp-img {
    display: block;
    width: min(58vw, 250px);
    height: auto;
    border: 5px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 8px 0 var(--ink);
  }

  @keyframes pop-in {
    0%   { transform: scale(0.35) rotate(-6deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* ============================================================
     クリア画面（全画面レイヤー）
     高さは vh を基準に組み、どの端末でもスクロールなしで収まるようにする
     ============================================================ */
  #clear-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 90;
    align-items: center;
    justify-content: center;
    padding: 14px;
    overflow-y: auto;   /* 極端に低い画面での保険 */
    background:
      radial-gradient(circle at 50% 42%, #ffffff 0%, #f7f1ff 45%, #e6d9fa 100%);
  }
  #clear-overlay.open { display: flex; animation: cutin-fade 0.35s ease; }

  /* 放射状の光条（淡く）
     position:fixed にしているのは、巨大な要素がオーバーレイの
     スクロール量に加算されてしまうのを防ぐため */
  #clear-rays {
    position: fixed;
    inset: 0;
    margin: auto;
    width: 200vmax;
    height: 200vmax;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(168, 112, 248, 0.10) 0deg 5deg,
      transparent 5deg 15deg
    );
    animation: spin 34s linear infinite;
    pointer-events: none;
  }

  #clear-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    animation: pop-in 0.42s cubic-bezier(0.2, 1.7, 0.4, 1);
  }

  #clear-badges {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #clear-stage {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.14em;
    color: var(--ink);
    padding: 5px 15px 4px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--ink);
  }
  #clear-stage.easy   { background: var(--cyan); }
  #clear-stage.normal { background: var(--violet); }
  #clear-stage.hard   { background: var(--pink); }

  /* クリア画面の肉球（達成の証としてスクショに残す）
     filterは枠と背景にもかかるため、必ず内側のimgだけに当てる */
  #clear-pips { display: flex; gap: 3px; }
  #clear-pips .cpip {
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--pink);
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #clear-pips .cpip img {
    width: 68%;
    height: 68%;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }

  /* クリアイラスト：画面の高さに合わせて縮む */
  #clear-img {
    display: block;
    width: auto;
    max-width: min(74vw, 300px);
    max-height: 33vh;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.16));
  }

  /* クリアタイム（耐久配信の記録用なので、しっかり見せる） */
  #clear-time {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink);
    padding: 7px 20px 8px;
  }
  #clear-time .t-label {
    font-size: clamp(11px, 2.2vw, 13px);
    font-weight: 900;
    letter-spacing: 0.18em;
    color: var(--violet-dp);
  }
  #clear-time-value {
    font-size: clamp(22px, 5.4vw, 30px);
    font-weight: 900;
    letter-spacing: 0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;  /* 桁がガタつかないように */
  }

  #clear-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: 100%;
    margin-top: 2px;
  }
  #clear-buttons .btn-row {
    display: flex;
    gap: 9px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* 祭りロゴ：タイムの真下。スクショでタイムと一緒に写る位置 */
  #festival-logo {
    display: block;
    width: min(46vw, 190px);
    height: auto;
    opacity: 0.9;
  }

  .action-btn {
    font-family: inherit;
    font-size: clamp(14px, 2.7vw, 17px);
    font-weight: 900;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 999px;
    padding: 12px 34px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
    transition: transform 0.07s ease, box-shadow 0.07s ease;
  }
  .action-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
  .action-btn:focus-visible { outline: 4px solid var(--violet); outline-offset: 3px; }

  #retry-btn { background: var(--yellow); }
  /* シェアはおまけなので、「もう一度あそぶ」より控えめな見た目にする
     （目立たせたい場合は background を var(--cyan) に戻すだけでOK） */
  #share-btn, #save-btn {
    display: inline-block;
    text-decoration: none;
    text-align: center;
    font-size: clamp(12px, 2.3vw, 14px);
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    padding: 10px 20px;
    box-shadow: 0 4px 0 var(--ink);
  }
  #share-btn { background: #dff4ff; }
  #save-btn  { background: #f0e4ff; }

  #back-btn, #clear-back-btn {
    margin-top: 4px;
    font-family: inherit;
    font-size: clamp(11px, 2.1vw, 13px);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--violet-dp);
    background: none;
    border: 2.5px solid var(--violet);
    border-radius: 999px;
    padding: 8px 20px;
    cursor: pointer;
  }
  #back-btn { margin-top: 14px; }
  #back-btn:hover, #clear-back-btn:hover { background: var(--violet); color: #fff; }
  #back-btn:focus-visible, #clear-back-btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

  /* ============================================================
     ごほうびカットイン（全画面演出）
     ============================================================ */
  #cutin {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    background: rgba(28, 12, 52, 0.92);
    cursor: pointer;
    overflow: hidden;
  }
  #cutin.open { display: flex; animation: cutin-fade 0.5s ease; }

  @keyframes cutin-fade { from { opacity: 0; } to { opacity: 1; } }

  /* 放射状の光条（ゆっくり回転） */
  #cutin-rays {
    position: absolute;
    width: 220vmax;
    height: 220vmax;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255, 252, 235, 0.13) 0deg 6deg,
      transparent 6deg 16deg
    );
    animation: spin 26s linear infinite;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 中央のグロー */
  #cutin-glow {
    position: absolute;
    width: min(120vw, 780px);
    height: min(120vw, 780px);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 108, 188, 0.55) 0%,
      rgba(168, 112, 248, 0.35) 40%,
      transparent 70%);
    animation: breathe 3.4s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes breathe {
    from { transform: scale(0.92); opacity: 0.8; }
    to   { transform: scale(1.06); opacity: 1; }
  }

  /* キラ粒子 */
  .spark {
    position: absolute;
    color: #fff5b0;
    font-size: 18px;
    pointer-events: none;
    animation: twinkle 2.2s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(255, 240, 120, 0.9);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1.1) rotate(35deg); }
  }

  #cutin-inner {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: reward-in 0.85s cubic-bezier(0.16, 1.1, 0.3, 1);
    max-height: 100%;
  }
  @keyframes reward-in {
    0%   { transform: scale(0.55); opacity: 0; filter: blur(8px); }
    60%  { filter: blur(0); }
    100% { transform: scale(1); opacity: 1; filter: blur(0); }
  }

  /* 祭りロゴは白背景前提のデザインなので、白いカードに載せる */
  #cutin-logo-card {
    display: inline-block;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 8px 16px 6px;
    margin-bottom: 14px;
    box-shadow: 0 0 22px rgba(255, 220, 255, 0.6);
  }
  #cutin-logo {
    display: block;
    width: min(46vw, 210px);
    height: auto;
  }

  /* ▼ 特典イラスト（reward.png）が入る場所 ▼ */
  #reward-img {
    display: block;
    max-width: min(76vw, 430px);
    max-height: 62vh;
    width: auto;
    height: auto;
    margin: 0 auto;
    filter: drop-shadow(0 0 26px rgba(255, 232, 160, 0.85));
  }

  /* 特典イラストが未実装のあいだ表示する仮枠（差し替え時に削除） */
  #reward-placeholder {
    width: min(70vw, 300px);
    aspect-ratio: 3 / 4;
    margin: 0 auto;
    border: 4px dashed var(--yellow);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.07);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px;
    color: #ffe800;
    font-weight: 800;
    font-size: clamp(12px, 2.4vw, 14px);
    line-height: 1.7;
    letter-spacing: 0.04em;
  }

  #cutin-caption {
    margin-top: 14px;
    font-size: clamp(12px, 2.4vw, 15px);
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #fff;
    text-shadow: 0 0 12px rgba(255, 200, 255, 0.9);
  }

  #cutin-close {
    margin-top: 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.14em;
    color: var(--ink);
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 999px;
    padding: 10px 30px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--ink);
  }
  #cutin-close:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }

  /* ============================================================
     アクセシビリティ：アニメーションを減らす設定への対応
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .result-box.show, #cutin.open, #cutin-inner { animation: none; }
    #cutin-rays, #cutin-glow, .spark { animation: none; }
    #clear-overlay.open, #clear-inner, #clear-rays { animation: none; }
    .shake { animation: none; }
  }

  /* 画面が低い端末では要素を詰める */
  @media (max-height: 700px) {
    #clear-inner { gap: 8px; }
    #clear-img { max-height: 31vh; }
    #festival-logo { width: min(40vw, 155px); }
    #clear-time { padding: 5px 16px 6px; }
  }

  /* さらに低い端末（iPhone SE など） */
  @media (max-height: 620px) {
    #clear-inner { gap: 6px; }
    #clear-img { max-height: 27vh; }
    #festival-logo { width: min(34vw, 130px); }
    #clear-time { padding: 4px 14px 5px; border-width: 3px; }
    #clear-time-value { font-size: 20px; }
    #clear-buttons { gap: 7px; }
    #clear-buttons .action-btn { padding: 9px 24px; }
    #clear-back-btn { padding: 6px 16px; }
  }

  /* 横向きスマホ：ボタンを全部横並びにして高さを稼ぐ */
  @media (max-height: 460px) {
    #clear-inner { gap: 5px; }
    #clear-img { max-height: 30vh; }
    #clear-buttons { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px; }
    #clear-buttons .btn-row { gap: 6px; }
    #clear-buttons .action-btn { padding: 8px 18px; font-size: 13px; }
    #clear-back-btn { margin-top: 0; padding: 6px 14px; }
    #festival-logo { width: min(26vw, 105px); }
    #clear-pips .cpip { width: 14px; height: 14px; }
    #clear-time { padding: 3px 12px 4px; border-width: 3px; }
    #clear-time-value { font-size: 18px; }
    #clear-stage { font-size: 12px; padding: 4px 12px 3px; }
  }

  /* 小さい画面での調整 */
  @media (max-width: 380px) {
    #panel { padding: 12px 10px 18px; border-radius: 20px; }
    #hud { flex-direction: column; gap: 6px; }
  }
</style>
</head>

  const liveTimer     = $("live-timer");
  const retryBtn      = $("retry-btn");
  const shareBtn      = $("share-btn");
  const saveBtn       = $("save-btn");
  const backBtn       = $("back-btn");
  const clearBackBtn  = $("clear-back-btn");
  const festivalLogo  = $("festival-logo");
  const cutin         = $("cutin");
  const cutinClose    = $("cutin-close");
  const rewardToggle  = $("reward-toggle");
  const rewardForm    = $("reward-form");
  const rewardInput   = $("reward-input");
  const rewardSubmit  = $("reward-submit");
  const rewardMsg     = $("reward-msg");

  $("streak-goal").textContent = CLEAR_STREAK;
  if (!SHOW_FESTIVAL_LOGO) festivalLogo.style.display = "none";
  if (!SHOW_LIVE_TIMER) liveTimer.classList.add("off");

  // 肉球スタンプを生成
  const PAW_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAMAAACdt4HsAAAAbFBMVEVHcEz/XV3/3Nz/2dn/2tr/2tr/39//0tL/////////2Nj/2dn/3d3/2Nj/3d3/2dn/29v/29v/2tr/2tr/29v/2dn/29v/29v/3Nz/29v/3t7/2tr/3d3/3d3/2tr/6Oj/4uL/6+v/5ub/7e1UNs37AAAAHnRSTlMAAc4t/f7/AwIBE/vhCe8d1rFSQ3pji8OiOv1xlWlpQj2TAAAD4klEQVRYw+1X65azKgwFFQHx1lqrta0g8/7v+CV4KVrbmen8PIe1ZrpaySbZSTaRkP/X90tS+Sd7jn9/gJCEFxl+fLgEqdM8PWeEfur/fTB9/BUknyFIUuSdYkwNTSa8KDgs+TMHrlr1sNRwcmyOsMJ90B8BHKwDYF1ezESC4eXcnpJ9YiU4J7zvgYl654KeXRAkaY22Q1pIsUf6knt3liwngMg044mSJMEQKaWGAxE7pGXHax2Cqdx44GKgGD9vBhdVxMInBEHC0lrbNcfJFzFzAAjxBR3j5DTa98rWD16n82VWanCuN7ZNHAInZz0BKHuErxTzyjaseJxXZkyaGoICEfCXyAd4OAA/XJ8Bars8LRMJPIBPMwkYApW8XCNuAI52etojyS7kWs+FANUMJM0bgMUnEvExWx5rPABID5xXymLW8IjJx8gEz9UsxZw13FByCAJAcwvERrZyFFwXUocnDj2HRwQ0canVVtvTSOoMEEFIO0oFVTK7CGk6uyMEyer2Vk1pnUNQw/3ZAXdcHs8+6nbc4vWeIEWENEF/HyTfb7+qmxAWANdgfGnPLyw10AcpXzRwletIRSxSgytVOdpOCFQWwaB1d+MvVZKT4mC0iUHG4JDRzySBMMTUjNn9fArfqSyYVG2ZprfESU92vAVpWrbV1OSj4VtBw+zwJHPSxe+lcwf+tcWEsJGcpYbgZ7lopjsEchJog4QAI5FOq9cHzykR8w65FOFS+8p09Svf0eficgkTPzopk9QsdYnF11vgZQ8CmD2VKo5Z3lwLTxevg28P5QNh3BGCboUoaeD6YayPrc7hFptK79H6y1KxTUHPN23Mye1LuQJlSnWTFpFV6z/CULFOr3zVBhBAGi97mbLppGZL66/jAIjg4oexBsAeaDilOxQ8IEx3Jd5VyUmr/a2zfJ71PgDsYNjq0uvhjq1cODuAg30FgO189piEIcL2ag0AdRSYqH+JMEqmJ2UdQDhFZSB/wBFIh+rZS4BRMqmHEB46jbXAOuvkD0aTlxTsqTrHOz/I4zjOD5W7RPm7CNDTPlxVg0C0InT94KrgErN39sqUmaQbRcaakO7zbRKBQaVMXO2oMhWTJtC9RkBLnCz6DuQlqHbGi80lx7a5V9ht2vZ5cKvoW/v1FTWZQ3qitGlPx0viTUEvAW5rAOigvK3DbNE8+d2Au6rjiOn0VCx3zI9GTL8KgHKnZVz8dOSG/D6SwBTq8S8nfkqaZZLpcOL67QvDIhEgUHn9HeW7AEeY96BqYt2EH72vCNl+GWNBxunvjx+lXtyb4HB/kvCPXrk+fNlCVeN/e+Gj5D+y/gHdEYWu3X90/wAAAABJRU5ErkJggg==";

  // 結果画像を描くとき用の肉球（画面には出さない）
  const pawSrcImg = new Image();
  pawSrcImg.src = PAW_SRC;

  for (let i = 0; i < CLEAR_STREAK; i++) {
    const pip = document.createElement("div");
    pip.className = "pip";
    const img = document.createElement("img");
    img.src = PAW_SRC;
    img.alt = "";
    pip.appendChild(img);
    pipsEl.appendChild(pip);
  }
  const pips = pipsEl.querySelectorAll(".pip");

  // クリア画面の肉球（達成の証）
  for (let i = 0; i < CLEAR_STREAK; i++) {
    const cell = document.createElement("span");
    cell.className = "cpip";
    const img = document.createElement("img");
    img.src = PAW_SRC;
    img.alt = "";
    cell.appendChild(img);
    clearPips.appendChild(cell);
  }

  /* ============================================================
     ゲーム状態
     ============================================================ */
  let stage = null, stageKey = null;
  let streak = 0;
  let running = false;
  let position = 0, direction = 1;
  let lastTime = null, rafId = null, nextTimer = null;
  let zoneStart = 0, zoneEnd = 0;
  let cutinOpen = false;

  // クリアタイム：1回目の成功で計測開始、10連成功で停止、失敗で0に戻す
  let timerStart = null;   // 計測開始時刻（nullなら未スタート）
  let clearMs    = 0;      // 確定したクリアタイム（ミリ秒）

  const currentSpeed = () => stage.baseSpeed * (1 + stage.speedRamp * streak);

  /* ============================================================
     タイム表示
     ============================================================ */
  const pad = (n, w) => String(n).padStart(w, "0");

  // クリア画面用：「1分23秒45」
  function formatJa(ms) {
    const total = Math.floor(ms / 10);          // 1/100秒単位
    const cs = total % 100;
    const s  = Math.floor(total / 100) % 60;
    const m  = Math.floor(total / 6000);
    return `${m}分${pad(s, 2)}秒${pad(cs, 2)}`;
  }

  // プレイ中の表示用：「1:23.45」
  function formatShort(ms) {
    const total = Math.floor(ms / 10);
    const cs = total % 100;
    const s  = Math.floor(total / 100) % 60;
    const m  = Math.floor(total / 6000);
    return `${m}:${pad(s, 2)}.${pad(cs, 2)}`;
  }

  const elapsed = () => (timerStart === null ? 0 : performance.now() - timerStart);

  function resetTimer() {
    timerStart = null;
    clearMs = 0;
    liveTimer.textContent = formatShort(0);
  }

  /* 成功ゾーンの配置 */
  function placeZone() {
    const w = stage.zoneWidth;
    if (stage.randomZone) {
      const min = 10, max = 90 - w;
      zoneStart = min + Math.random() * (max - min);
    } else {
      zoneStart = 50 - w / 2;
    }
    zoneEnd = zoneStart + w;
    okZone.style.left  = zoneStart + "%";
    okZone.style.width = w + "%";
  }

  function updateHud() {
    streakCount.textContent = streak;
    pips.forEach((pip, i) => pip.classList.toggle("on", i < streak));
  }

  /* マーカーの往復移動 */
  function tick(now) {
    if (lastTime === null) lastTime = now;
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    position += direction * currentSpeed() * dt;

    if (position >= 100)     { position = 200 - position; direction = -1; }
    else if (position <= 0)  { position = -position;      direction = 1;  }

    marker.style.left = position + "%";

    // 進行中のタイムを更新（計測が始まっているあいだだけ）
    if (timerStart !== null) liveTimer.textContent = formatShort(elapsed());

    if (running) rafId = requestAnimationFrame(tick);
  }

  function hideResults() {
    resultSuccess.classList.remove("show");
    resultFail.classList.remove("show");
    clearOverlay.classList.remove("open");
  }

  function startRound() {
    hideResults();
    placeZone();
    position = 0;
    direction = 1;
    lastTime = null;
    running = true;
    marker.style.left = "0%";
    rafId = requestAnimationFrame(tick);
  }

  /* ストップ＆判定 */
  function stopMarker() {
    if (!running || cutinOpen) return;
    running = false;
    cancelAnimationFrame(rafId);

    const isSuccess = (position >= zoneStart && position <= zoneEnd);

    if (isSuccess) {
      // 1回目の成功でタイマースタート
      if (streak === 0) timerStart = performance.now();

      streak++;
      updateHud();

      if (streak >= CLEAR_STREAK) {
        // 10連成功でタイマーストップ
        clearMs = elapsed();
        timerStart = null;
        liveTimer.textContent = formatShort(clearMs);
        clearTimeValue.textContent = formatJa(clearMs);

        // クリアは全画面レイヤーで表示（スクロール不要・スクショ映え優先）
        clearStage.textContent = stage.name;
        clearStage.className = stageKey;
        clearOverlay.classList.add("open");
        shareBtn.href = intentUrl();   // ステージ名とタイムを入れた投稿文を作っておく
        return;
      }
      resultSuccess.classList.add("show");
      nextTimer = setTimeout(startRound, NEXT_DELAY_SUCCESS);

    } else {
      // 失敗：連続数もタイムも0に戻す
      streak = 0;
      updateHud();
      resetTimer();
      resultFail.classList.add("show");
      nextTimer = setTimeout(startRound, NEXT_DELAY_FAIL);
    }
  }

  /* ステージ開始／戻る */
  function startStage(key) {
    stageKey = key;
    stage = STAGES[key];
    streak = 0;
    stageLabel.textContent = stage.name;
    stageLabel.className = key;
    selectScreen.style.display = "none";
    gameScreen.style.display = "block";
    updateHud();
    resetTimer();
    startRound();
  }

  function backToSelect() {
    running = false;
    cancelAnimationFrame(rafId);
    clearTimeout(nextTimer);
    hideResults();
    gameScreen.style.display = "none";
    selectScreen.style.display = "block";
  }

  /* ============================================================
     ごほうびカットイン
     ============================================================ */
  function makeSparks() {
    if (cutin.querySelector(".spark")) return; // 一度だけ生成
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("span");
      s.className = "spark";
      s.textContent = "✦";
      s.style.left = (Math.random() * 92 + 4) + "%";
      s.style.top  = (Math.random() * 88 + 6) + "%";
      s.style.fontSize = (12 + Math.random() * 16) + "px";
      s.style.animationDelay = (Math.random() * 2.2) + "s";
      cutin.appendChild(s);
    }
  }

  function openCutin() {
    makeSparks();
    cutinOpen = true;
    cutin.classList.add("open");
  }

  function closeCutin() {
    cutinOpen = false;
    cutin.classList.remove("open");
  }

  function checkCode() {
    const input = rewardInput.value.trim().toUpperCase();
    if (!input) return;

    if (input === REWARD_CODE.trim().toUpperCase()) {
      rewardMsg.textContent = "";
      rewardInput.value = "";
      openCutin();
    } else {
      rewardMsg.textContent = "ちがうみたい…もういちど確認してね";
      rewardForm.classList.remove("shake");
      void rewardForm.offsetWidth;   // アニメーションを再生し直すため
      rewardForm.classList.add("shake");
    }
  }

  /* ============================================================
     Xシェア
     投稿文とURLを渡すだけのシンプルな作り。
     画像はXがOGP（ogp.png）を自動で展開するので添付は不要
     ============================================================ */
  function intentUrl() {
    const text = `PONチェッカー【${stage.name}】クリアしました！\n`
               + `タイム ${formatJa(clearMs)}\n`
               + SHARE_TAGS;
    return "https://x.com/intent/post"
         + "?text=" + encodeURIComponent(text)
         + "&url="  + encodeURIComponent(SHARE_URL);
  }

  /* ============================================================
     クリア画面をPNGで保存
     canvasに描き起こすので、外部ライブラリは不要
     ============================================================ */
  const SHOT_W = 1200, SHOT_H = 675;

  function roundRect(ctx, x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  // 肉球を白く塗ったものを1度だけ作っておく
  let whitePaw = null;
  function getWhitePaw() {
    if (whitePaw) return whitePaw;
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const x = c.getContext("2d");
    try { x.filter = "brightness(0) invert(1)"; } catch (e) {}
    x.drawImage(pawSrcImg, 0, 0, 64, 64);
    whitePaw = c;
    return c;
  }

  function buildResultImage() {
    const cv = document.createElement("canvas");
    cv.width = SHOT_W; cv.height = SHOT_H;
    const ctx = cv.getContext("2d");
    const JP = "'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif";

    // 背景（淡いラベンダー＋斜めストライプ）
    const g = ctx.createLinearGradient(0, 0, 0, SHOT_H);
    g.addColorStop(0, "#f8f3ff");
    g.addColorStop(1, "#e4d8fa");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SHOT_W, SHOT_H);

    ctx.save();
    ctx.strokeStyle = "rgba(168,112,248,0.10)";
    ctx.lineWidth = 18;
    for (let i = -SHOT_H; i < SHOT_W + SHOT_H; i += 48) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + SHOT_H, SHOT_H); ctx.stroke();
    }
    ctx.restore();

    // 白いカード
    ctx.fillStyle = "#000";
    roundRect(ctx, 34, 34, SHOT_W - 60, SHOT_H - 60, 26); ctx.fill();
    ctx.fillStyle = "#fff";
    roundRect(ctx, 26, 26, SHOT_W - 60, SHOT_H - 60, 26); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = "#000";
    roundRect(ctx, 26, 26, SHOT_W - 60, SHOT_H - 60, 26); ctx.stroke();

    // 上段：タイトルバナー
    const banner = $("banner");
    if (banner && banner.complete) ctx.drawImage(banner, 340, 60, 520, 130);

    ctx.strokeStyle = "#e2d6f7"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(78, 208); ctx.lineTo(1114, 208); ctx.stroke();

    // 下段左：クリアイラスト
    const ci = $("clear-img");
    if (ci && ci.complete) ctx.drawImage(ci, 128, 228, 360, 360);

    // 下段右：成果ブロック
    const CX = 845;
    const colors = { easy: "#5fd8ff", normal: "#a870f8", hard: "#ff6cbc" };
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    // ステージバッジ
    const bw = 280, bh = 86, bx = CX - bw / 2, by = 238;
    ctx.fillStyle = "#000"; roundRect(ctx, bx + 7, by + 8, bw, bh, 43); ctx.fill();
    ctx.fillStyle = colors[stageKey] || "#a870f8";
    roundRect(ctx, bx, by, bw, bh, 43); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = "#000";
    roundRect(ctx, bx, by, bw, bh, 43); ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.font = "900 48px " + JP;
    ctx.fillText(stage.name, CX, by + bh / 2 + 2);

    // クリアタイム（この画像の主役）
    const tw = 470, th = 96, tx = CX - tw / 2, ty = 348;
    ctx.fillStyle = "#000"; roundRect(ctx, tx + 7, ty + 8, tw, th, 22); ctx.fill();
    ctx.fillStyle = "#fff"; roundRect(ctx, tx, ty, tw, th, 22); ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = "#000"; roundRect(ctx, tx, ty, tw, th, 22); ctx.stroke();

    ctx.fillStyle = "#7b3fd4";
    ctx.font = "900 20px " + JP;
    ctx.textAlign = "left";
    ctx.fillText("TIME", tx + 26, ty + th / 2 + 1);

    const timeStr = formatJa(clearMs);
    let tfs = 46;
    ctx.font = "900 " + tfs + "px " + JP;
    while (ctx.measureText(timeStr).width > tw - 120 && tfs > 24) {
      tfs -= 2; ctx.font = "900 " + tfs + "px " + JP;
    }
    ctx.fillStyle = "#000";
    ctx.textAlign = "center";
    ctx.fillText(timeStr, CX + 36, ty + th / 2 + 2);

    // 肉球スタンプ（台紙風に1列）
    const sw = 470, sh = 60, sx = CX - sw / 2, sy = 468;
    ctx.fillStyle = "#000"; roundRect(ctx, sx + 5, sy + 6, sw, sh, 18); ctx.fill();
    ctx.fillStyle = "#fff6fb"; roundRect(ctx, sx, sy, sw, sh, 18); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#000"; roundRect(ctx, sx, sy, sw, sh, 18); ctx.stroke();

    if (pawSrcImg.complete) {
      const wp = getWhitePaw();
      const R = 18, GAP = 6;
      const total = CLEAR_STREAK * R * 2 + (CLEAR_STREAK - 1) * GAP;
      let px = sx + (sw - total) / 2 + R;
      const py = sy + sh / 2;
      for (let i = 0; i < CLEAR_STREAK; i++) {
        ctx.fillStyle = "#ff6cbc";
        ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3.5; ctx.strokeStyle = "#000"; ctx.stroke();
        ctx.drawImage(wp, px - R * 0.66, py - R * 0.66, R * 1.32, R * 1.32);
        px += R * 2 + GAP;
      }
    }

    // 祭りロゴ
    if (SHOW_FESTIVAL_LOGO && festivalLogo.complete) {
      ctx.drawImage(festivalLogo, CX - 115, 540, 230, 92);
    }

    return new Promise((res) => cv.toBlob(res, "image/png"));
  }

  function saveResultImage() {
    buildResultImage().then((blob) => {
      if (!blob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `pon-checker_${stage.name}_${formatJa(clearMs).replace(/[分秒]/g, "-")}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }).catch(() => {});
  }

  /* ============================================================
     入力イベント
     ============================================================ */
  $("btn-easy").addEventListener("click",   () => startStage("easy"));
  $("btn-normal").addEventListener("click", () => startStage("normal"));
  $("btn-hard").addEventListener("click",   () => startStage("hard"));

  gameScreen.addEventListener("pointerdown", (e) => {
    // ボタン類のクリックはストップ扱いにしない
    if (e.target.closest("button")) return;
    stopMarker();
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && gameScreen.style.display === "block" && !cutinOpen) {
      e.preventDefault();
      stopMarker();
    }
    if (e.key === "Escape" && cutinOpen) closeCutin();
  });

  retryBtn.addEventListener("click",     (e) => { e.stopPropagation(); startStage(stageKey); });
  shareBtn.addEventListener("click",     (e) => { e.stopPropagation(); });  // リンクはそのまま開く
  saveBtn.addEventListener("click",      (e) => { e.stopPropagation(); saveResultImage(); });
  backBtn.addEventListener("click",      (e) => { e.stopPropagation(); backToSelect(); });
  clearBackBtn.addEventListener("click", (e) => { e.stopPropagation(); backToSelect(); });

  rewardToggle.addEventListener("click", () => {
    rewardForm.classList.toggle("open");
    if (rewardForm.classList.contains("open")) rewardInput.focus();
  });
  rewardSubmit.addEventListener("click", checkCode);
  rewardInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); checkCode(); }
  });

  cutinClose.addEventListener("click", (e) => { e.stopPropagation(); closeCutin(); });
  cutin.addEventListener("click", closeCutin);
  $("cutin-inner").addEventListener("click", (e) => e.stopPropagation());
</script>
